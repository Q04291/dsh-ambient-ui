name: Auto tag release

# Publishing is tag-driven (publish.yml runs on `v*`), so a version bump that
# ships without a tag never reaches npm. This tags the version in package.json
# whenever it is not tagged yet, which then triggers publish.yml.
on:
  push:
    branches: [master]
    paths:
      - package.json

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve version from package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "could not read version from package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip if tag already exists
        id: guard
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists — nothing to do"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag v$VERSION is missing — creating it"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and push tag
        if: steps.guard.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "release v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
